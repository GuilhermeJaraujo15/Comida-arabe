<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sabores do Oriente</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="stylesheet" href="formulário.css">
    <link rel="stylesheet" href="lang-switcher.css">
</head>

<body>
    <div class="language-switcher" role="group" aria-label="Seletor de idioma">
        <div class="language-pill">
            <span id="language-current-flag" class="language-flag" aria-hidden="true"></span>
            <span id="language-current-label" class="language-label">Português</span>
            <button id="language-menu-toggle" class="language-caret-btn" type="button" aria-label="Abrir seleção de idioma"
                aria-expanded="false">⌄</button>
        </div>
        <div id="language-dropdown" class="language-dropdown" role="menu" aria-label="Escolher idioma">
            <button id="language-alt-option" class="language-option-item" type="button" role="menuitem">
                <span id="language-alt-flag" class="language-flag" aria-hidden="true"></span>
                <span id="language-alt-label">English</span>
            </button>
        </div>
    </div>
    <header>
        <h1>Sabores da Terra</h1>
    </header>

    <nav>
        <div class="back-icon">
            <a href="index.html">
                <i class="fas fa-arrow-left"></i>
            </a>
        </div>
    </nav>


    <div class="container">
        <div class="auth-options">
            <div class="auth-card">
                <h2><i class="fas fa-sign-in-alt"></i> <span>Entrar</span></h2>
                <form>
                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="seu@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Senha</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>


                    <button class="btn-auth" aria-label="Entrar">Entrar</button>

                </form>

                <div class="divider">
                    <span>ou</span>
                </div>

                <h2><i class="fas fa-user-plus"></i> <span>Cadastrar</span></h2>
                <form>
                    <div class="form-group">
                        <label for="name">Nome Completo</label>
                        <input type="text" id="name" placeholder="Seu nome" required>
                    </div>

                    <div class="form-group">
                        <label for="new-email">E-mail</label>
                        <input type="email" id="new-email" placeholder="seu@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="new-password">Senha</label>
                        <input type="password" id="new-password" placeholder="Mínimo 8 caracteres" required>
                    </div>

                    <button type="submit" class="btn-auth">Cadastrar</button>
                </form>
            </div>
        </div>
    </div>
</body>

<footer>
    <p>&copy; 2025 Sabores da Terra</p>
    <p style="margin-top: 0.5rem;"></p>
</footer>
<script src="i18n.js" defer></script>

</html>
